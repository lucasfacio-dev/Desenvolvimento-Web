<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #005fbe, #001833);
        }

        .container {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #001833;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgb(0, 0, 0);
            border-radius: 10px;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        .opcoes {
            margin-top: 10px;
        }

        .opcoes label {
            display: inline-block;
            margin-right: 150px;
        }

        .opcoes input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
        }

        button:hover {
            background-color: #005fbe;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Formulário</h1>

        <form>
            <label for="nome">Nome: </label>
            <input type="text" id="nome" name="nome" placeholder="digite seu nome" required>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="digite seu e-mail" required>

            <label for="senha">Senha: </label>
            <input type="password" id="senha" name="senha" placeholder="digite sua senha" required>

            <label for="data">Data de nascimento: </label>
            <input type="date" id="data" name="data" required>

            <label for="curso">Curso: </label>
            <select id="curso" name="curso" required>
                <option value="">Selecione seu curso</option>
                <option>Engenharia de software</option>
                <option>Ciencia da computação</option>
                <option>Outro</option>
            </select>

            <label>Sexo: </label>
            <div class="opcoes">
                <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
            </div>

            <label>Interesses: </label>
            <div class="opcoes">
                <label><input type="checkbox" name="interesses" value="tecnologia"> Desenvolvimento de software</label>
                <label><input type="checkbox" name="interesses" value="esportes"> IA e Ciencia de dados</label>
                <label><input type="checkbox" name="interesses" value="musica"> Cibersegurança</label>
                <label><input type="checkbox" name="interesses" value="jogos"> Banco de dados</label>
            </div>

            <label for="comentarios">Comentário extra: </label>
            <textarea id="comentarios" name="comentarios" placeholder="Escreva um comentário extra (opcional)"></textarea>

            <label for="arquivo">Upload de arquivo (envie seu currículo): </label>
            <input type="file" id="arquivo" name="arquivo">

            <button type="submit">Enviar cadastro</button>
        </form>

    </div>
</body>
</html>
